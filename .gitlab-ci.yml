default:
  tags:
    - vlx-docker
  image: ghcr.io/veloxchem/meta-vlx/vlx-ci_gnu:sha-0e81798
  interruptible: true

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_SOURCE_PROJECT_ID != $CI_PROJECT_ID'
      when: never
    - when: always

stages:
  - build
  - test

.conf:
  variables:
    VLX_NUM_BUILD_JOBS: "12"
    # cpus reserved for a CI job; OpenMP threads are derived from this in the jobs
    VLX_CI_THREADS: "12"
    # MPI ranks used by the distributed test runs
    VLX_CI_MPI_RANKS: "2"
    OMPI_ALLOW_RUN_AS_ROOT: "1"
    OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
  before_script:
    - uname -a
    - free -m
    - df -h
    - ulimit -a
    - ulimit -s unlimited
    - lscpu | egrep 'Thread|Core|Socket|^CPU\('
    - python -V
    - gcc --version
    - g++ --version
    - echo "=== OpenMPI ==="
    - which mpicc mpiexec mpicc.openmpi mpiexec.openmpi
    - mpicc.openmpi --showme:version
    - mpiexec.openmpi --version | head -2

.setup:
  extends:
    - .conf
  before_script:
    - !reference [ .conf, before_script]
    - python -m venv --clear venv
    - source venv/bin/activate
    - python -m pip install --upgrade
        pip
        setuptools
        wheel

pip_install:
  extends: .setup
  stage: build
  script:
    - CC=gcc MPICC=mpicc.openmpi python -m pip install --no-cache-dir mpi4py --no-binary=mpi4py
    - mpiexec.openmpi --bind-to none -n 2 python -c "from mpi4py import MPI; size = MPI.COMM_WORLD.Get_size(); assert size == 2, size"
    - CC=gcc CXX=g++ python -m pip install
        MDAnalysis
        "networkx<3.7"
    - git clone -b 3.4.0 https://gitlab.com/libeigen/eigen.git
    - git clone -b boost-1.90.0 https://github.com/boostorg/math.git boost-math
    - cd eigen && test "$(git rev-parse HEAD)" = "3147391d946bb4b6c68edd901f2add6ac1f31f8c" && cd ..
    - cd boost-math && test "$(git rev-parse HEAD)" = "e0fcd19f7227d81391770ea46015acc3c80af810" && cd ..
    - export EIGEN_INCLUDE_DIR=$(pwd)/eigen
    - export BOOST_INCLUDE_DIR=$(pwd)/boost-math/include
    - SKBUILD_CONFIGURE_OPTIONS="-DCMAKE_CXX_COMPILER=g++ -DVLX_USE_MATHLIB=ON -DVLX_MATH_LIBRARY=/usr/lib/x86_64-linux-gnu/openblas-openmp/libopenblas.so"
        python -m pip install -v .[test,qmmm]
  timeout: 2h
  artifacts:
    paths:
      - venv
    expire_in: 2 days

python_tests:
  extends: .conf
  stage: test
  needs: ["pip_install"]
  script:
    - source venv/bin/activate
    - python -c "import veloxchem; print(veloxchem.__version__)"
    # serial steps use the whole allocation, MPI steps share it across the ranks
    - export OMP_NUM_THREADS="${VLX_CI_THREADS}"
    - export VLX_MPI_THREADS="$((VLX_CI_THREADS / VLX_CI_MPI_RANKS))"
    - test "$VLX_MPI_THREADS" -ge 1
        || { echo "VLX_CI_THREADS ($VLX_CI_THREADS) < VLX_CI_MPI_RANKS ($VLX_CI_MPI_RANKS)"; exit 1; }
    - OMP_NUM_THREADS="$VLX_MPI_THREADS" mpiexec.openmpi --bind-to none
        -n "$VLX_CI_MPI_RANKS" python -c "from mpi4py import MPI; size = MPI.COMM_WORLD.Get_size(); assert size == 2, size"
    - OMP_NUM_THREADS="$VLX_MPI_THREADS" mpiexec.openmpi --bind-to none
        -n "$VLX_CI_MPI_RANKS" python -m pytest --capture=no --log-cli-level=INFO
        -m "solvers" --durations=10
    - python -m pytest --cov=veloxchem --capture=no --log-cli-level=INFO
        -m "not timeconsuming" --durations=10
    - git clone https://github.com/VeloxChem/vlx-extra-tests.git
    - python -m pytest --capture=no --log-cli-level=INFO vlx-extra-tests/tests
  timeout: 2h
